{% extends 'base.html' %}{% block content %}<h1>Payments</h1><table><tr><th>ID</th><th>Student</th><th>Event</th><th>Amount</th><th>Method</th><th>Status</th></tr>{% for p in payments %}<tr><td>{{p.payment_id}}</td><td>{{p.student_name}}</td><td>{{p.event_name}}</td><td>₹{{p.amount}}</td><td>{{p.payment_method or '—'}}</td><td>{{p.payment_status}}</td></tr>{% endfor %}</table>{% endblock %}
